<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhận diện món Việt</title>
<style>
  :root { --bg:#f7f4ef; --panel:#fff; --ink:#22201c; --muted:#706a60; --line:#e6e0d6;
          --accent:#b45309; --bar:#f2c48f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151412; --panel:#1f1d1a; --ink:#ece8e1; --muted:#a39d92; --line:#2f2c27;
            --accent:#f59e0b; --bar:#8a5a1c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0; } .sub { color: var(--muted); margin: 4px 0 20px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  #drop { border:2px dashed var(--line); border-radius:10px; min-height:260px; display:flex;
          align-items:center; justify-content:center; text-align:center; color:var(--muted);
          cursor:pointer; overflow:hidden; }
  #drop.over { border-color: var(--accent); }
  #drop img { max-width:100%; max-height:340px; display:block; }
  .row { margin: 10px 0; } .row b { display:flex; justify-content:space-between; font-weight:600; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:4px; }
  .bar span { display:block; height:100%; background:var(--bar); }
  .meta { color:var(--muted); font-size:13px; margin-top:10px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Đây là món gì?</h1>
  <p class="sub">Kéo thả hoặc chọn một ảnh món ăn Việt Nam. Mô hình EfficientNet-B0 (ONNX) chạy trên CPU,
     xác suất đã hiệu chỉnh (temperature scaling) · <a href="/docs">API</a></p>
  <div class="grid">
    <section><div id="drop" tabindex="0">Thả ảnh vào đây<br>hoặc bấm để chọn</div>
      <input id="file" type="file" accept="image/*" hidden></section>
    <section><div id="out"><p class="meta">Kết quả sẽ hiện ở đây.</p></div></section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function classify(file) {
  $("drop").innerHTML = `<img alt="ảnh đã chọn" src="${URL.createObjectURL(file)}">`;
  $("out").innerHTML = `<p class="meta">Đang nhận diện…</p>`;
  const r = await fetch("/predict?k=5", {method: "POST", body: file});
  if (!r.ok) { $("out").innerHTML = `<p class="meta">Lỗi ${r.status}: ${esc((await r.json()).detail || "")}</p>`; return; }
  const d = await r.json();
  $("out").innerHTML = d.predictions.map((p) => `<div class="row"><b><span>${esc(p.name)}</span>
    <span>${(100 * p.probability).toFixed(1)}%</span></b><div class="bar"><span style="width:${100 * p.probability}%"></span></div></div>`).join("")
    + `<p class="meta">${d.elapsed_ms} ms trên CPU</p>`;
}
$("drop").onclick = () => $("file").click();
$("drop").onkeydown = (e) => { if (e.key === "Enter") $("file").click(); };
$("file").onchange = (e) => e.target.files[0] && classify(e.target.files[0]);
["dragover", "dragenter"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, () => $("drop").classList.remove("over")));
$("drop").addEventListener("drop", (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) classify(f); });
</script>
</body>
</html>
